name: Autonomous Live Trading
on:
  schedule:
    - cron: '*/15 13-20 * * 1-5'
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install
        run: pip install -r requirements.txt
      - name: Run bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
        run: python bot.py
      - name: Save
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add paper_ledger.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "auto trade" || true
          git push || true
