name: Autonomous Live Trading
on:
  schedule:
    - cron: '*/1 13-20 * * 1-5'
  workflow_dispatch:
jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python bot.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add paper_ledger.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "auto trade"
          git push || true
